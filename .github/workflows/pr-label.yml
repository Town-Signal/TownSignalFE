name: PR Auto Label

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: PR 제목 컨벤션 기준으로 라벨링
        uses: actions/github-script@v7
        with:
          script: |
            const types = ['feat', 'fix', 'docs', 'style', 'refactor', 'chore', 'todo'];
            const title = context.payload.pull_request.title;
            const match = title.match(/^(feat|fix|docs|style|refactor|chore|todo)(\([^)]*\))?:/);

            const { data: current } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const toRemove = current.filter(l => types.includes(l.name) && l.name !== match?.[1]);
            for (const l of toRemove) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: l.name,
              });
            }

            if (match) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [match[1]],
              });
            }
